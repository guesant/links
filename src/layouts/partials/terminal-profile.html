{{ if .home }}
  {{ $profile := .profile }}
  <header class="terminal-profile">
    <p class="terminal-prompt">whoami</p>
    <h1>{{ $profile.name }}</h1>
    {{ with $profile.username }}<p class="terminal-username">@{{ . }}</p>{{ end }}
    {{ with $profile.bio }}<p class="terminal-bio">{{ . }}</p>{{ end }}
    {{ with $profile.birthDate }}<p class="terminal-uptime"><span>{{ $.uptimeLabel }}</span> <time datetime="{{ . }}" data-uptime="{{ . }}" data-uptime-locale="{{ $.locale }}">{{ . }}</time></p>{{ end }}
  </header>
{{ end }}
