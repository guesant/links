{{ $name := lower (. | default "link") }}
{{ $sprite := resources.Get "icons/pixel.svg" | fingerprint }}
{{ if not (findRE (printf `<symbol id="%s"` $name) $sprite.Content) }}{{ $name = "link" }}{{ end }}
<svg class="link-icon-symbol-svg" data-platform="{{ $name }}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><use href="{{ $sprite.RelPermalink }}#{{ $name }}"></use></svg>
