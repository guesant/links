{{ $ui := index hugo.Data.editorial.ui (lower site.Language.Lang) }}
<dialog id="bios-dialog" class="bios-dialog" aria-labelledby="bios-title" aria-describedby="bios-status">
  <h2 id="bios-title">GuesantBIOS · {{ $ui.bios_title }}</h2>
  <p id="bios-status">{{ $ui.bios_status }}</p>
  <p>{{ $ui.interface }}: <span data-bios-interface></span></p>
  <progress aria-label="{{ $ui.bios_title }}"></progress>
  <button type="button" data-bios-skip>{{ $ui.bios_skip }} · Esc</button>
</dialog>
