<!doctype html>
{{ $data := hugo.Data.links }}
{{ $localized := index $data.locales (lower .Site.Language.Lang) }}
<html lang="{{ $localized.ui.html_lang }}" data-theme="{{ $data.theme.appearance | default "system" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="theme-{{ hugo.Data.links.theme.preset }} appearance-{{ hugo.Data.links.theme.appearance }} background-{{ hugo.Data.links.theme.background }}">
    <a class="skip-link" href="#main-content">{{ $localized.ui.skip_link }}</a>
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
  </body>
</html>
