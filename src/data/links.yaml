now:
  en:
    seo:
      title: Now | Gabriel R. Antunes
      description: Current interests, projects and work in progress by Gabriel R. Antunes.
    title: Now
    intro: A current view of the interests I cultivate, the work I do and the things I still want to build.
    sections:
      - id: personal-context
        title: Personal context
        description: Music, games and personal ambitions are part of the context behind these links.
      - id: current-focus
        title: Current focus
        description: Studying Go and infrastructure in a personal lab while continuing to work on applications and open-source projects.
      - id: work-in-progress
        title: Work in progress
        description: Building and maintaining public software, documenting what I learn and connecting practical projects with open-source work.
      - id: next
        title: What comes next
        description: Keep improving the lab, learn through practical projects and make room for the things I still want to build.
  pt-br:
    seo:
      title: Agora | Gabriel R. Antunes
      description: Interesses atuais, projetos e trabalho em andamento de Gabriel R. Antunes.
    title: Agora
    intro: Um retrato atual dos interesses que cultivo, do trabalho que faço e das coisas que ainda quero construir.
    sections:
      - id: personal-context
        title: Contexto pessoal
        description: Música, jogos e ambições pessoais também fazem parte do contexto por trás destes links.
      - id: current-focus
        title: Foco atual
        description: Estudo Go e infraestrutura em um laboratório pessoal enquanto continuo trabalhando com aplicações e projetos open source.
      - id: work-in-progress
        title: Trabalho em andamento
        description: Construo e mantenho software público, documento o que aprendo e conecto projetos práticos ao trabalho open source.
      - id: next
        title: O que vem pela frente
        description: Continuar aprimorando o laboratório, aprender com projetos práticos e abrir espaço para as coisas que ainda quero construir.

