name: Update public statistics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Collect and publish in Dev Container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        env:
          GITHUB_STATS_TOKEN: ${{ github.token }}
        with:
          push: never
          env: |
            GITHUB_STATS_TOKEN
            GITHUB_REPOSITORY
            GITHUB_SERVER_URL
          runCmd: |
            just test
            just stats
            node .config/scripts/publish-stats.mjs
