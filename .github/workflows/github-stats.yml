name: Update GitHub stats card

on:
  push:
    branches:
      - main
    paths-ignore:
      - src/static/images/cards/github-stats.svg
      - src/static/images/badges/*.svg
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare generated assets
        run: mkdir --parents src/static/images/cards src/static/images/badges

      - name: Build stats image
        run: docker build --file .config/container/Dockerfile --target quality --tag guesant-links-quality:ci .

      - name: Generate user card
        env:
          GITHUB_STATS_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --env GITHUB_STATS_TOKEN="$GITHUB_STATS_TOKEN" \
            --env GITHUB_STATS_USERNAME=guesant \
            --env GITHUB_STATS_OUTPUT=/work/src/static/images/cards/github-stats.svg \
            --volume "$PWD:/work" \
            --workdir /work \
            guesant-links-quality:ci \
            node .config/scripts/github-stats.mjs

      - name: Refresh Shields
        run: |
          mkdir --parents src/static/images/badges
          curl --fail --location 'https://img.shields.io/github/followers/guesant?style=flat-square&label=followers' --output src/static/images/badges/github-followers.svg
          curl --fail --location 'https://img.shields.io/github/stars/guesant?style=flat-square&label=stars' --output src/static/images/badges/github-stars.svg
          curl --fail --location 'https://img.shields.io/badge/YouTube-%40JipaCoding-FF0000?style=flat-square&logo=youtube&logoColor=white' --output src/static/images/badges/youtube-channel.svg
          curl --fail --location 'https://img.shields.io/badge/open%20source-projects-72b7ff?style=flat-square' --output src/static/images/badges/open-source.svg

      - name: Commit generated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/static/images/cards/github-stats.svg src/static/images/badges
          git diff --staged --quiet || git commit -m 'chore(cards): refresh github stats'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}
