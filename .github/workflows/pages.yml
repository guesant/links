name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build Hugo image
        run: docker build --tag guesant-links:ci .
      - name: Build static site
        env:
          HUGO_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          mkdir -p public
          docker run --rm --volume "$PWD/public:/src/public" guesant-links:ci --minify --cleanDestinationDir --baseURL "$HUGO_BASE_URL"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
