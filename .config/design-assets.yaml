generator: builtin-imagegen
reference: user-provided lobby screenshot
assets:
  - file: website/src/assets/images/ui/charcoal-planks.png
    mode: generate
    prompt: >-
      Use case: stylized-concept. Asset type: production seamless square raster UI material, not a mockup. Generate one tileable flat orthographic surface of very dark charcoal-black oak horizontal planks, as the calm interior face of an ornate voxel adventure game's wooden sign. Fine subtle straight horizontal grain and narrow recessed plank seams, tiny pixelated tool marks, consistent small discrete square pixel art, nearly black low contrast throughout, slightly warm gray highlights only on the top lip of each plank. The visual target is aged almost-black wood, NOT brown swirling walnut, not photographic grain. Planks run perfectly horizontally edge to edge. Uniform flat dim illumination, no vignette. Seamless tiling on every edge. No frame, no moss, no corners, no objects, no text or logo, no lighting effects, no gradient, no background scene. Opaque square image fully filled with the material. This will repeat underneath small high contrast website text. Keep the face restrained, blackened and readable.
  - file: website/src/assets/images/ui/aged-oak-surface.png
    mode: generate
    prompt: >-
      Use case: stylized-concept. Asset type: one reusable seamless square game UI material texture, not a mockup. Create an orthographic flat front-facing surface of tightly fitted horizontal aged charcoal-brown oak planks for a rustic voxel fantasy website. Very dark nearly black chocolate wood, subtle longitudinal grain, a few tiny knots, shallow tool marks and thin recessed seams. Restrained low contrast across the reading surface, carefully crafted discrete pixel-art material shading, consistent small square pixels. Dim cool ambient lighting, no bright highlights. Must tile seamlessly on all four edges, uniform material and illumination edge to edge. No frame, borders, ornaments, foliage, rivets, lanterns, objects, perspective, gradients, vignettes, text or logos. Opaque image filled completely with dark wooden planks. This will be scaled to a small repeating surface behind readable text; detail must remain understated.
  - file: website/src/assets/images/scenery/night-canyon.png
    prompt: >-
      Use case: stylized-concept. Asset type: full screen website BACKGROUND scenery, landscape 3:2 composition. The attached screenshot is a STYLE AND ENVIRONMENT reference only, REMOVE ALL of its UI, text, frames, icons, rails, buttons and chains. Create a richly detailed Minecraft-inspired voxel valley at night: immense steep blocky stone cliffs and forests on both left and right edges, tiny oak houses and amber lanterns built into ledges, wooden bridges across ravines, deep blue winding river running toward distant mountains through the center. Square moon near upper right, blocky blue clouds, dark navy sky. High craft voxel environmental illustration, crisp block geometry and small foliage details, restrained deep navy, forest green, charcoal stone, warm amber lights, reflective blue water. View from across a lush canyon with depth and many recognisable stone cubes. Dense detailed illuminated village structures toward the sides, a relatively dark and quiet central strip reserved for a webpage placed over it. Scene fills edge to edge. No UI, no borders, no text, no logos, no signs, no big foreground objects blocking the center. Keep the scenery dark yet readable, with atmospheric distance. NO blur baked into image, no vignette baked in; website will apply its own blur and dim. Do not reproduce screenshot layout.
  - file: website/src/assets/images/ui/suspension-rail.png
    prompt: >-
      Use case: stylized-concept. Asset type: production transparent pixel-art game UI ornament, a single vertical suspension rail. Reference image: the attached website design establishes the style only. Create ONE precisely front-facing slim vertical iron chain and stone suspension rail. Tall portrait, the artwork occupies a central vertical strip with generous fully transparent sides. A straight continuous sequence of squared interlocking iron chain links runs from the very top to the very bottom, seamless at top and bottom. Near the top a substantial square riveted stone-and-iron mounting bracket, at the middle one hanging amber lantern fixed to a stone bracket, near the bottom a small square stone clasp. Sparse moss and a few tiny vines growing on stone only. Readable chunky pixel art with hard square stepped silhouettes, oak brown lantern cage, warm golden light, deep slate stone highlights. Pixel lattice consistent, no anti-aliased outlines. Functional game UI sprite, orthographic 2D, detailed material shading and bolts. Transparent background, no scene, no interface, no text, no letters, no ground, no cast shadow beyond a tiny local outline. Keep the straight chain aligned to the exact center. The lantern is about twice as wide as the chain; the stone mounting bracket is about three times as wide as the chain. Do not create a full page or a frame.
  - file: website/src/assets/images/ui/stone-frame.png
    prompt: >-
      Use case: stylized-concept. Asset type: a transparent nine-slice game UI frame asset, ONE square frame. Use the reference website screenshot only for style. Create a precisely square, front-facing, thin dark weathered stone-and-iron panel border with a large completely TRANSPARENT square center and fully transparent space outside. This is a production UI border-image sprite, not a full page or mockup. The frame consists of four STRAIGHT equally thick rails, each roughly 6 percent of total image width. Small square riveted reinforcement pieces at all four corners, sparse tiny moss at the corners and along the top rail, no moss inside the center. Tightly fitted charcoal gray stone blocks, slate highlights on upper and left edges, black inner recessed edge, aged bronze pinpoint rivets. Geometrically exact squared frame, no perspective, consistent thickness on all sides. Subtle carved cracks, hard pixel art, crisp stepped outline, discrete small highlights, refined Minecraft inspired fantasy game material. Keep the central 80 percent square completely empty transparent. Avoid interior fill, text, letters, buttons, scenery, side objects, drop shadow beyond a small pixel outline.
  - file: website/src/assets/images/ui/section-toolbar-rail.png
    mode: generate
    prompt: >-
      Use case: ui-mockup. Asset type: repeatable transparent PNG texture for a website heading ornament. The accepted centered title-rail prototype establishes the visual style. Generate one horizontal middle segment of the thin wooden rail beside the title, front-facing, perfectly straight, low-profile, pixel-art raster texture. Dark oak plank with restrained grain and thin dark edges, matching the warm brown wood in the prototype. The left and right edges should join seamlessly when repeated horizontally. Keep transparent pixels above and below the beam. No end caps, corners, vertical pieces, vines, text, shadows, glow, or background. Crisp pixel edges, no blur. This is a reusable rail strip, not a UI screenshot.
  - file: website/src/assets/images/ui/section-toolbar-terminal.png
    mode: generate
    prompt: >-
      Use case: ui-mockup. Asset type: transparent pixel-art PNG sprite for the outer end fitting of a horizontal website title rail. Create exactly two adjacent square fittings in one compact horizontal pair, front-facing and symmetrical as a unit. The left block is cool gray iron and stone with a small blue-gray highlight; the right block is dark moss green with a tiny warm brass center. The two blocks must be visibly different in color and material. Dark beveled pixel edges, clean square silhouette, restrained detail matching the voxel-inspired oak rail. Transparent pixels around the pair. No rail, shadows outside the pixels, glow, text, third block, vertical leg, or background. The opposite end will use a horizontally mirrored copy so the two colors reflect around the title.
  - file: website/src/assets/images/ui/oak-frame.png
    prompt: >-
      Use case: stylized-concept. Asset type: transparent nine-slice wooden game UI frame asset, ONE square frame. Style reference: the supplied Minecraft inspired website screenshot. Produce an exact front-facing square dark oak wood sign FRAME with fully transparent square CENTER. Four narrow equally thick straight wooden rails (approximately 7 percent total image width), oak planks with subtle grain and warm amber edge highlights, dark brown recessed inner lip. Square iron and weathered stone reinforcement plates at each corner, tiny brass rivets. A few hanging green moss pixels and short vines only at top two corners. Crisp high quality pixel art, consistent pixel grid, sharp geometric silhouette, refined fantasy adventure UI material. Rails straight so this can be stretched as a 9-slice border for a wide profile sign. No perspective. Central 78 percent completely transparent, nothing covering that area. Transparent exterior. No lanterns, chains, scenery, text, letters, symbols, background, title, panels inside the frame. No blur.
