baseURL = 'https://guesant.github.io/links/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
disablePathToLower = true
title = 'Gabriel R. Antunes | Links'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']

[params]
  description = 'Perfis, projetos e links de Gabriel R. Antunes.'

[markup]
  [markup.goldmark.renderer]
    unsafe = false

[languages]
  [languages.pt-br]
    label = 'Português (Brasil)'
    locale = 'pt-BR'
    weight = 1

  [languages.zh]
    label = '中文'
    locale = 'zh-CN'
    weight = 2

  [languages.fr]
    label = 'Français'
    locale = 'fr-FR'
    weight = 3

  [languages.es]
    label = 'Español'
    locale = 'es-ES'
    weight = 4

  [languages.it]
    label = 'Italiano'
    locale = 'it-IT'
    weight = 5

  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 6
