baseURL = 'https://guesant.net/'
defaultContentLanguage = 'pt-br'
defaultContentLanguageInSubdir = true
disablePathToLower = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS']
noBuildLock = true
publishDir = '../.local/build/site'
resourceDir = '../.cache/hugo/resources'

[[module.mounts]]
source = 'assets'
target = 'assets'

[[module.mounts]]
source = '../.cache/federation/assets'
target = 'assets'

[sitemap]
  changefreq = 'monthly'
  priority = 0.8

[markup]
  [markup.goldmark.renderer]
    unsafe = false

[languages]
  [languages.pt-br]
    label = 'Português (Brasil)'
    locale = 'pt-BR'
    weight = 1

  [languages.zh]
    label = '中文'
    locale = 'zh-CN'
    weight = 2

  [languages.fr]
    label = 'Français'
    locale = 'fr-FR'
    weight = 3

  [languages.es]
    label = 'Español'
    locale = 'es-ES'
    weight = 4

  [languages.it]
    label = 'Italiano'
    locale = 'it-IT'
    weight = 5

  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 6
