      Use case: precise-object-edit. Asset type: production transparent PNG mouse cursor, one standalone sprite. Input image: the user's SIX-CURSOR reference sheet, not an edit target for the whole sheet. Recreate ONLY the UPPER-LEFT DEFAULT ARROW, as faithfully as possible, as a single isolated cursor. Keep its exact silhouette: vertical left edge, sharp upper-left pointing tip, diagonal cream staircase rim descending to the right, short tail bending toward lower right, warm dark-oak brown interior, pale sandstone bevel, very dark thin outer outline, tiny moss patches along the left edge and lower notch, small golden rivets at the lower-left and right corner. Match the reference's chunky pixel geometry, material shading, warm palette and level of detail. Do not redesign as a generic arrow or a flat vector icon. Front-facing 2D pixel-art game UI sprite. Square transparent canvas, cursor centered with a small even transparent margin, complete silhouette not clipped. Strong readable shape suitable for a 48x48 CSS cursor. Real alpha transparency everywhere outside the cursor, including notches. No black background, no checkerboard pattern painted into image, no sheet, no other cursors, no labels, letters, watermark, scenes or drop shadow outside its close dark outline.
