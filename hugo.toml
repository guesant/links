baseURL = 'https://guesant.github.io/links/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
disablePathToLower = true
title = 'Gabriel R. Antunes | Links'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'RSS', 'sitemap']

[params]
  description = 'Perfis, projetos e links de Gabriel R. Antunes.'

[markup]
  [markup.goldmark.renderer]
    unsafe = false

[languages]
  [languages.en]
    label = 'English'
    locale = 'en'
    weight = 1

  [languages.pt-br]
    label = 'Português (Brasil)'
    locale = 'pt-BR'
    weight = 2
